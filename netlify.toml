# Netlify configuration for 108 Photobooth (static site, no build step)

[build]
  # No build command needed — this is plain HTML/CSS/JS.
  publish = "."

# Sensible security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively (safe for a simple site;
# bump filenames if you ever need to force a refresh)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
